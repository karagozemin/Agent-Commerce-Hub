services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agenthub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agenthub_postgres:
